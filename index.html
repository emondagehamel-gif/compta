<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151D19" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comptabilité">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-feuille-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon-feuille.png">
<title>Comptabilité</title>
<style>
/* Compagnon de terrain de l'application de bureau : mêmes couleurs, une colonne, barre d'onglets en bas. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --surface-2:#F7F9F6; --sunk:#E9EEE8;
  --ink:#16221D; --ink-2:#33423B; --muted:#5F6F67; --line:#E0E7E1; --line-strong:#C7D1C9;
  --accent:#2347A6; --accent-ink:#FFFFFF; --accent-soft:#E8EEFB;
  --pos:#1F7A4A; --pos-soft:#E1F2E8; --neg:#B23A2E; --neg-soft:#FBE8E4; --warn:#8F5E00; --warn-soft:#FBF0D6;
  --s1:#3B5BB5; --s2:#C77B2A; --s3:#7A4FB5; --s4:#0F7C86; --scrim:rgba(14,22,18,.42);
  --shadow:0 10px 30px rgba(16,24,20,.16),0 2px 6px rgba(16,24,20,.08);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --font-d:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --r:12px; --r-sm:9px; --tab:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#151D19; --surface-2:#19221E; --sunk:#0B100D;
  --ink:#E5EDE7; --ink-2:#C4D0C9; --muted:#93A49B; --line:#25302A; --line-strong:#37453E;
  --accent:#A4B8F5; --accent-ink:#0D1730; --accent-soft:#1E2945;
  --pos:#7FD0A0; --pos-soft:#153022; --neg:#F2958A; --neg-soft:#3A1F1B; --warn:#EAC06A; --warn-soft:#352A12;
  --s1:#6F88D6; --s2:#B97B38; --s3:#B59BE6; --s4:#5FC4CC; --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#151D19; --surface-2:#19221E; --sunk:#0B100D;
  --ink:#E5EDE7; --ink-2:#C4D0C9; --muted:#93A49B; --line:#25302A; --line-strong:#37453E;
  --accent:#A4B8F5; --accent-ink:#0D1730; --accent-soft:#1E2945;
  --pos:#7FD0A0; --pos-soft:#153022; --neg:#F2958A; --neg-soft:#3A1F1B; --warn:#EAC06A; --warn-soft:#352A12;
  --s1:#6F88D6; --s2:#B97B38; --s3:#B59BE6; --s4:#5FC4CC; --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--font-d);margin:0;font-weight:650;letter-spacing:-.005em;text-wrap:balance}
h1{font-size:1.45rem;line-height:1.2} h2{font-size:1.05rem} h3{font-size:.95rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)} .small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,#3F8C4D,#235A2F);color:#FFFFFF;--leaf-vein:#2C6B39;display:grid;place-items:center;flex:none;box-shadow:0 1px 2px rgba(20,60,30,.25)}
.logo .ic{width:18px;height:18px}
.logo .ic.feuille{width:26px;height:26px;stroke-width:0}
.who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.who b{font-family:var(--font-d);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);border:none;background:none;padding:0;cursor:pointer;text-align:left}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--pos);flex:none}
.sync.wait i{background:var(--warn)} .sync.err i{background:var(--neg)} .sync.busy i{background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sync.busy i{animation:none}}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border:none;background:none;border-radius:10px;color:var(--ink-2);cursor:pointer;flex:none;padding:0}
.icon-btn:active{background:var(--sunk)}

main{padding-block:14px calc(var(--tab) + 28px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-h h2{display:flex;align-items:center;gap:8px}
.card-h h2 .ic{color:var(--accent)}
.banner{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.banner.err{background:var(--neg-soft);border-color:color-mix(in srgb,var(--neg) 35%,transparent)}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}

/* Commandes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:8px 14px;font-weight:600;cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:active{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 50%,transparent)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:.88rem}
.btn.link{border:none;background:none;color:var(--accent);padding:6px 4px;min-height:0}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btn .ic{width:18px;height:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;border-radius:8px;padding:8px 6px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;justify-content:center;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .n{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.85rem;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip{display:inline-flex;align-items:center;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap;line-height:1.55}
.chip.ok{background:var(--pos-soft);color:var(--pos)} .chip.due{background:var(--warn-soft);color:var(--warn)} .chip.late{background:var(--neg-soft);color:var(--neg)}
.chip.open{color:var(--muted);border:1px solid var(--line-strong)} .chip.info{background:var(--accent-soft);color:var(--accent)}

/* Listes */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:none;border-top:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer;min-width:0;color:inherit}
.item:first-child{border-top:none}
.item:active{background:var(--surface-2)}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.item .t b{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.item .t small{color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.item .v{text-align:right;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.item .k{width:10px;height:10px;border-radius:50%;flex:none}
.when{width:44px;flex:none;text-align:center;line-height:1.1;border-radius:9px;padding:5px 0;background:var(--surface-2);border:1px solid var(--line)}
.when b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}
.when small{font-size:.62rem;text-transform:uppercase;color:var(--muted);font-weight:700}
.empty{padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.group-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:4px 2px 0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;cursor:pointer}
.kpi .val{font-family:var(--font-d);font-size:1.25rem;font-weight:650;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{color:var(--muted);font-size:.78rem}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv div:last-child{border-bottom:none}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}

/* Calendrier */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .dow{font-size:.66rem;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;padding:2px 0}
.cal button{border:none;background:none;border-radius:10px;padding:5px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:44px;color:var(--ink)}
.cal button.other{color:var(--muted);opacity:.6}
.cal button .d{font-weight:600;font-variant-numeric:tabular-nums;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.cal button.today .d{color:var(--accent);font-weight:800}
.cal button.sel .d{background:var(--accent);color:var(--accent-ink)}
.cal .dots{display:flex;gap:2px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%}

/* Panneau (formulaires et fiches) */
.sheet-ov{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94%;height:94%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1;min-width:0}
.sheet-b{flex:1;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap}
.sheet-f .btn{flex:1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.82rem;font-weight:650;color:var(--ink-2)}
.field small{color:var(--muted);font-size:.78rem}
.ctl{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:10px 12px;min-height:44px;font-size:16px}
.ctl:focus{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 22%,transparent);outline-offset:0}
textarea.ctl{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.money{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line-strong);padding:0 2px 2px}
.money:focus-within{border-color:var(--accent)}
.money input{border:none;background:transparent;outline:none;font-family:var(--font-d);font-size:2.1rem;font-weight:650;width:100%;min-width:0;font-variant-numeric:tabular-nums;padding:0}
.money span{font-size:1.3rem;color:var(--muted);font-weight:600}
.calc{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.picks{display:flex;gap:6px;flex-wrap:wrap}
.pick{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:.88rem;font-weight:600;display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);min-height:38px}
.pick[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pick .sw{width:8px;height:8px;border-radius:50%}
.check{display:flex;gap:10px;align-items:center;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photo{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:none;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.photo button .ic{width:14px;height:14px}
.cam{display:flex;gap:8px}
.cam label{flex:1}
.err{color:var(--neg);font-weight:600;font-size:.9rem;width:100%}
.hint{font-size:.84rem;border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:0 8px 8px 0}
details.more{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:0 12px}
details.more summary{padding:11px 0;font-weight:650;cursor:pointer;color:var(--ink-2)}
details.more[open]{padding-bottom:12px}
details.more[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details.more>div{display:flex;flex-direction:column;gap:12px}
.line{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:8px}
.line .three{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:end}
.tot{display:flex;flex-direction:column;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .g{border-top:2px solid var(--line-strong);margin-top:4px;padding-top:8px;font-size:1.1rem;font-weight:700}
.doc-lines{width:100%;border-collapse:collapse;font-size:.9rem}
.doc-lines td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.doc-lines td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:10px}
.copy{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 6px 6px 12px}
.copy span{flex:1;min-width:0;overflow-wrap:anywhere;user-select:all}

/* Barre d'onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab);align-items:center}
.tabbar button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);cursor:pointer;padding:6px 0;position:relative}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .add{justify-self:center;width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 40%,transparent)}
.tabbar .add .ic{width:26px;height:26px;stroke-width:2.2}
.tabbar .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:999px;background:var(--neg);color:#fff;font-size:.66rem;display:grid;place-items:center;padding:0 4px}
.addgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.addgrid button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;cursor:pointer;min-height:96px;color:var(--ink)}
.addgrid button .ic{width:24px;height:24px;color:var(--accent)}
.addgrid button b{font-size:.95rem}
.addgrid button small{color:var(--muted);font-size:.78rem;line-height:1.3}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + 14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:.9rem;z-index:80;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.toast-a{background:none;border:none;color:var(--bg);font-weight:700;text-decoration:underline;padding:2px 4px}
.sheet-open .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.line.rabais [data-amt]{color:var(--pos)}
.pick:disabled{opacity:.45;cursor:not-allowed}
.line .three.q3{grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1.3fr)}
.lt-sel{flex:1;min-height:36px;padding:6px 8px;font-weight:600}
.doc-lines td.grp{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding-top:12px}
.send-opt{display:flex;gap:12px;align-items:flex-start;text-align:left}
.send-opt .ic{flex:none;margin-top:3px;color:var(--accent)}
.send-opt .t small{display:block;color:var(--muted);font-size:.8rem;font-weight:400}
.sig-ov{position:fixed;inset:0;z-index:300;background:rgba(15,20,18,.55);display:flex;align-items:center;justify-content:center;padding:12px}
.sig-box{background:#fff;color:#1e2622;border-radius:14px;width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.sig-h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:1.05rem}
.sig-x{border:0;background:none;font-size:1.7rem;line-height:1;cursor:pointer;color:#67716b;padding:0 4px}
.sig-t{margin:0;font-size:.92rem;color:#3b453f;line-height:1.45}
.sig-zone{position:relative;height:min(260px,42vh);border:1.5px dashed #9aa79f;border-radius:10px;background:#fbfcfb;touch-action:none;overflow:hidden}
.sig-zone canvas{position:absolute;inset:0;touch-action:none}
.sig-ph{position:absolute;left:16px;top:12px;color:#9aa79f;font-size:.9rem;pointer-events:none}
.sig-l{position:absolute;left:16px;right:16px;bottom:40px;border-bottom:1.5px solid #c9d2cc;pointer-events:none}
.sig-n{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:#67716b}

async function api(path, o){
  o = o || {};
  if (!online()) throw {code:"hors-reseau"};
  if (!tokOk(5000)) throw {code:"login"};
  let r;
  try { r = await fetch((o.upload ? API + "/upload" : API) + path, {method:o.method || "GET", headers:Object.assign({Authorization:"Bearer " + TOK.t}, o.headers || {}), body:o.body, cache:"no-store"}); }
  catch(e){ throw {code:"reseau", message:"Google Drive ne répond pas."}; }
  if (r.status === 401){ TOK = null; LS.set("tok", null); throw {code:"login"}; }
  if (!r.ok){
    let m = ""; try { const j = await r.json(); m = (j.error && j.error.message) || ""; } catch(e){}
    throw {code: r.status === 403 && /insufficient|scope/i.test(m) ? "login" : (r.status >= 500 || r.status === 429 || r.status === 403) ? "reseau" : "drive", message: m || "Erreur " + r.status};
  }
  return o.raw ? r : r.json();
}
async function list(q, n){
  const p = new URLSearchParams({q: q + " and trashed = false", pageSize:String(n || 50), fields:"files(id,name,mimeType,modifiedTime,parents)", orderBy:"modifiedTime desc", spaces:"drive"});
  const r = await api("/drive/v3/files?" + p.toString());
  return (r.files || []).map(f => ({id:f.id, title:f.name, mimeType:f.mimeType, modifiedTime:f.modifiedTime, parentId:(f.parents || [])[0] || ""}));
}

async function findRegistre(root){ const L = (await list("name = 'registre.json' and " + inP(root), 10)).filter(f => f.mimeType !== FOLDER); return L[0] || null; }
async function subFolder(root, name){ const L = await list("name = '" + qs(name) + "' and mimeType = '" + FOLDER + "' and " + inP(root), 5); return L[0] ? L[0].id : ""; }
async function findIds(){
  const c = LS.get("ids", null);
  if (c && c.root && await findRegistre(c.root)) return c;
  const folders = await list("name = 'Comptabilite' and mimeType = '" + FOLDER + "'", 30);

async function downloadJSON(id){ const r = await api("/drive/v3/files/" + encodeURIComponent(id) + "?alt=media", {raw:true}); return JSON.parse(await r.text()); }
async function downloadBlob(id){ const r = await api("/drive/v3/files/" + encodeURIComponent(id) + "?alt=media", {raw:true}); return r.blob(); }
async function createFile(name, parent, blob, type){
  const b = "cmpt" + Math.random().toString(36).slice(2);
  const meta = JSON.stringify({name, parents:[parent], mimeType:type});
  const body = new Blob(["--" + b + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + meta + "\r\n--" + b + "\r\nContent-Type: " + type + "\r\n\r\n", blob, "\r\n--" + b + "--\r\n"], {type:"multipart/related; boundary=" + b});

const IDB = {
  db: null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => { const r = indexedDB.open("comptabilite", 1); r.onupgradeneeded = () => r.result.createObjectStore("photos"); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); });
  },
  async run(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => { const tx = db.transaction("photos", mode), q = fn(tx.objectStore("photos")); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });

async function syncAll(manual, why){

  if (!tokOk(120000)){
    const queued = S.pending.some(p => p.etat === "attente");
    if (canRedirect(manual) && (manual || queued || why === "start" || why === "retour")){ authRedirect(manual && Date.now() - (LS.get("authFail", 0) || 0) < 15 * 60000); return; }
    if (!S.d) S.conn = "login"; S.connErr = "login"; render(); syncLabel(); return;
  }

      S.ids = ids; LS.set("ids", ids);

    const st = errState(e);
    if (st === "dossier" && S.ids){ S.ids = null; LS.set("ids", null); }

async function refreshCore(){

async function sendOp(type, data, files){
  const id = "op-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);

    if (!(retry && await existsIn(S.ids.tel, op.id + ".json"))) await uploadJSON(op.id + ".json", op);

async function prepFile(file){
  if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) return file.size < 900000 ? {blob:file, type:"application/pdf", ext:".pdf", url:""} : null;
  try {
    const url = URL.createObjectURL(file), img = new Image(); img.src = url; await img.decode();
    const sc = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
    const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
    let b = await new Promise(r => c.toBlob(r, "image/jpeg", 0.8)); if (b && b.size > 650000) b = await new Promise(r => c.toBlob(r, "image/jpeg", 0.6));
    return b ? {blob:b, type:"image/jpeg", ext:".jpg", url} : null;
  } catch(e){ return null; }
}

document.querySelector("main").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const ds = b.dataset;
  if (ds.act === "connect" || ds.act === "refresh") syncAll(true);
  else if (ds.act === "login") authRedirect(true);
  else if (ds.act === "trip-cancel"){ LS.set("trip", null); toast("Trajet annulé"); render(); }
  else if (ds.lieudel){ const l = (S.d.lieux || []).find(x => x.id === ds.lieudel); if (l){ toast("Lieu retiré : " + l.nom); sendOp("lieu-suppr", {id:l.id}); } }
  else if (ds.act === "switch"){ if (!online()) return toast("Il faut du réseau pour changer de compte."); logout(); authRedirect(true); }
  else if (ds.act === "cfg"){ const v = ($("cfg-id").value || "").trim(); if (!/\.apps\.googleusercontent\.com$/.test(v)) return toast("Cet identifiant ne semble pas bon : il doit finir par .apps.googleusercontent.com"); LS.set("clientId", v); S.conn = "init"; render(); syncAll(true); }
  else if (ds.tabgo) showTab(ds.tabgo);
  else if (ds.add) startAdd(ds.add, ds.eq ? {equipement:ds.eq} : {});
  else if (ds.ev) openEv(ds.ev);
  else if (ds.fac) openFacture(ds.fac);
  else if (ds.dev) openDevis(ds.dev);
  else if (ds.cli) openClient(ds.cli);
  else if (ds.day){ S.calSel = ds.day; S.calM = ds.day.slice(0, 7); vAgenda(); }
  else if (ds.cal){ const [y, m] = S.calM.split("-").map(Number), n = iso(new Date(y, m - 1 + Number(ds.cal), 1)); S.calM = n.slice(0, 7); S.calSel = S.calM === today().slice(0, 7) ? today() : n; vAgenda(); }
  else if (ds.vt){ S.vt = ds.vt; vVentes(); }
  else if (ds.vtf){ S.vtF = ds.vtf; vVentes(); }
  else if (ds.odo) fOdometre(ds.odo);
  else if (ds.rdv){ const q = S.d.equipements.find(x => x.id === ds.rdv), nx = q ? nextMaint(q)[0] : null; fEvenement(null, {type:"garage", equipement:ds.rdv, titre:(nx ? nx.type : "Entretien") + ", " + (q ? q.nom : ""), heure:"08:00", fin:"09:00"}); }
  else if (ds.retry){ const p = S.pending[Number(ds.retry)]; if (p){ p.etat = "attente"; savePending(); syncAll(true); } }
});

function startAdd(k, p){

/* ===== Trajets : GPS (départ et arrivée) ou à la main ===== */
const OSRM = window.__OSRM || "https://router.project-osrm.org";
const tripNow = () => LS.get("trip", null);
function gpsPos(fresh){
  return new Promise((res0, rej0) => {
    if (!navigator.geolocation) return rej0({message:"Le GPS n'est pas disponible sur cet appareil. Inscris le trajet à la main."});
    let done = false; const res = v => { if (!done){ done = true; clearTimeout(tm); res0(v); } }, rej = v => { if (!done){ done = true; clearTimeout(tm); rej0(v); } };
    const tm = setTimeout(() => rej({message:"Position introuvable pour l'instant. Réessaie dans un moment, ou inscris le trajet à la main."}), 60000);
    navigator.geolocation.getCurrentPosition(
      p => res({lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy || 0), t: new Date().toISOString()}),
      e => rej({message: e && e.code === 1 ? "Le téléphone refuse l'accès à ta position. Autorise-la : Paramètres du téléphone › Applications › Chrome › Autorisations › Position, puis réessaie." : "Position introuvable pour l'instant. Réessaie dans un moment, idéalement à l'extérieur."}),
      {enableHighAccuracy:true, timeout:30000, maximumAge: fresh ? 0 : 15000});
  });
}
/* Distance par la route (OpenStreetMap / OSRM). Sans réseau : estimation à vol d'oiseau × 1,25, recalculée avant l'envoi. */
async function routeKm(a, b){
  if (!online()) return null;
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 12000);
  try {
    const r = await fetch(OSRM + "/route/v1/driving/" + a.lng + "," + a.lat + ";" + b.lng + "," + b.lat + "?overview=false&alternatives=false&steps=false", {signal: ctl.signal});
    if (!r.ok) return null; const j = await r.json();
    return j && j.code === "Ok" && j.routes && j.routes[0] ? Math.round(j.routes[0].distance / 100) / 10 : null;
  } catch(e){ return null; } finally { clearTimeout(tm); }
}
const estKm = (a, b) => Math.max(0.1, Math.round(distGeo([a.lat, a.lng], [b.lat, b.lng]) * 1.25 * 10) / 10);

const sigBouton = (kind, x) => !x.signature && telSigOK() && x.statut !== "annulee" ? '<button class="btn wide sig-go" type="button" data-x="signer">' + ico("i-pen") + "Faire signer le client</button>" : "";
function openFacture(id){
  const f0 = S.d.factures.find(x => x.id === id); if (!f0) return; const f = avecSig(f0), t = S.tmap[f.transaction];
  openSheet("Facture " + f.numero, docBody("facture", f) + sigLigne(f) + sigBouton("facture", f) + '<p class="muted small">Le PDF est aussi créé sur l\'ordinateur, dans le dossier factures, quand il reçoit la facture.</p>',
    {secondary:'<button class="btn" type="button" data-x="pdf">' + ico("i-send") + "Envoyer</button>" + (f.statut !== "annulee" ? '<button class="btn" type="button" data-x="mod">Modifier</button>' : "") + (t && unpaid(t) ? '<button class="btn primary" type="button" data-x="pay">Encaisser</button>' : ""),
     onClick: ev => { const b = ev.target.closest("button"); if (!b) return; if (b.dataset.copy) return copyTxt(b.dataset.copy);
       const x = b.dataset.x; if (x === "pdf") sendDoc("facture", f); else if (x === "signer") fSigner("facture", f); else if (x === "mod") fDoc("facture", f0); else if (x === "pay") fEncaisser(f0); }});
}
function openDevis(id){
  const v0 = S.d.devis.find(x => x.id === id); if (!v0) return; const v = avecSig(v0), s = devStatus(v0);
  openSheet(docTitre("devis") + " " + v.numero, docBody("devis", v) + sigLigne(v) + (s.k !== "facture" ? cieBloc(v) + sigBouton("devis", v) : "") + (s.k !== "facture" && !v.signature ? '<div class="row"><button class="btn sm" type="button" data-x="accepte">Accepté par le client</button><button class="btn sm" type="button" data-x="refuse">Refusé</button></div>' : ""),
    {secondary:'<button class="btn" type="button" data-x="pdf">' + ico("i-send") + "Envoyer</button>" + (s.k !== "facture" ? '<button class="btn" type="button" data-x="mod">Modifier</button><button class="btn primary" type="button" data-x="fac">Facturer</button>' : ""),
     onClick: async ev => { const b = ev.target.closest("button"); if (!b) return; if (b.dataset.copy) return copyTxt(b.dataset.copy);
       const x = b.dataset.x; if (x === "pdf") sendDoc("devis", v); else if (x === "signer") fSigner("devis", v); else if (x === "sigcie") fSignerCie(v); else if (x === "sigcie-suppr") fRetirerCie(v); else if (x === "mod") fDoc("devis", v0); else if (x === "fac") fDoc("facture", null, {client:v.client, lignes:v.lignes, codeTaxe:v.codeTaxe, message:v.message, fromDevis:v.id, taxesIncluses:!!v.taxesIncluses, taxesLigne:!!v.taxesLigne, travaux:v.travaux || "", lieu:v.lieu || "", dateTravaux:v.dateTravaux || ""});
       else if (x === "accepte" || x === "refuse"){ closeSheet(); toast("Devis " + (x === "accepte" ? "accepté" : "refusé")); await sendOp("devis-statut", {id:v.id, statut:x}); } }});
}
function openClient(id){
  const c = S.d.clients.find(x => x.id === id); if (!c) return;
  const fs = S.d.factures.filter(f => f.clientId === c.id || norm(f.client) === norm(c.nom)).sort((a, b) => b.date.localeCompare(a.date));
  openSheet(c.nom, (c.telephone ? '<div class="copy"><span>' + esc(c.telephone) + '</span><a class="btn sm" href="tel:' + esc(c.telephone.replace(/[^\d+]/g, "")) + '">Appeler</a><button class="btn sm" type="button" data-copy="' + esc(c.telephone) + '">Copier</button></div>' : "") + (c.courriel ? '<div class="copy"><span>' + esc(c.courriel) + '</span><button class="btn sm" type="button" data-copy="' + esc(c.courriel) + '">Copier</button></div>' : "") +
    (c.adresse ? '<div class="copy"><span>' + esc(c.adresse) + '</span><a class="btn sm" href="' + esc(mapURL(c.adresse)) + '" target="_blank" rel="noopener">Itinéraire</a></div>' : "") +
    (fs.length ? '<div class="list">' + fs.map(f => { const s = facStatus(f); return '<button class="item" type="button" data-f="' + esc(f.id) + '"><span class="t"><b>' + esc(f.numero) + "</b><small>" + esc(dShort(f.date)) + '</small></span><span class="v">' + fmt(docTotal("facture", f)) + '<span class="chip ' + s.cls + '">' + esc(s.l) + "</span></span></button>"; }).join("") + "</div>" : '<p class="muted small">Aucune facture pour ce client.</p>'),
    {secondary:'<button class="btn" type="button" data-x="devis">Devis</button><button class="btn primary" type="button" data-x="facture">Facture</button>',
     onClick: ev => { const b = ev.target.closest("button"); if (!b) return; if (b.dataset.copy) return copyTxt(b.dataset.copy); if (b.dataset.f) return openFacture(b.dataset.f); if (b.dataset.x) fDoc(b.dataset.x, null, {client:c.nom}); }});
}
function fEncaisser(f){
  const t = S.tmap[f.transaction]; if (!t) return; const def = (S.d.comptes.find(c => c.sorte === "banque") || S.d.comptes[0] || {}).id;
  openSheet("Encaisser " + f.numero, '<p><b>' + fmt(txTotal(t)) + "</b> de " + esc(f.client) + '</p><div class="field"><span>Déposé dans</span><div class="picks">' + comptePicks(def, "") + "</div></div>" + dateField("p-date"),
    {primary:"Enregistrer le paiement", state:{cpt:def}, onClick: e => { if (dateClick(e)) return; const k = e.target.closest("[data-cpt]"); if (k){ S.form.cpt = k.dataset.cpt; pressSet("[data-cpt]", "data-cpt", k.dataset.cpt); } },
     onSubmit: async () => { const compte = S.form.cpt; if (!compte) return fail("Choisis le compte."); const date = $("p-date").value || today(); closeSheet(); toast("Paiement de " + fmt(txTotal(t)) + " envoyé"); await sendOp("paiement", {transaction:t.id, date, compte}); }});
}
/* PDF : créé sur le téléphone, puis partagé (texto, courriel…) ou enregistré */
async function phoneLogo(){
  if (S.logo !== undefined) return S.logo; S.logo = null;
  const p = R().logo; if (!p) return null;
  const saved = await IDB.get("__logo");
  if (saved && saved.src === p){ S.logo = {w:saved.w, h:saved.h, data:saved.data}; return S.logo; }
  if (!S.ids || !S.ids.docs || !online() || !tokOk()) return null;
  try {
    const L = await list("name = '" + qs(p.split("/").pop()) + "' and " + inP(S.ids.docs), 3); if (!L[0]) return null;
    const bl = await downloadBlob(L[0].id), url = URL.createObjectURL(bl), img = new Image(); img.src = url; await img.decode();
    const sc = Math.min(1, 700 / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
    const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
    const b = await new Promise(res => c.toBlob(res, "image/jpeg", 0.92)); S.logo = b ? {w, h, data:new Uint8Array(await b.arrayBuffer())} : null;
    if (S.logo) IDB.put("__logo", Object.assign({src:p}, S.logo)).catch(() => {});
  } catch(e){ S.logo = null; }
  return S.logo;
}
async function savePDF(kind, x){
  try {
    const name = fileSafe(x.numero + " " + x.client) + ".pdf";
    const file = new File([docPDF(kind, x, await phoneLogo())], name, {type:"application/pdf"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], title:name}); return; }
      catch(e){ if (e && e.name === "AbortError") return; }
    }
    const url = URL.createObjectURL(file), a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast("PDF enregistré dans Téléchargements.");
  } catch(e){ toast("PDF non créé : " + ((e && e.message) || "erreur")); }
}

/* ===== Démarrage ===== */
(function start(){
  /* La version complète demande une connexion Google : on la fait ici (adresse autorisée), puis on y retourne */
  const qp = new URLSearchParams(location.search);
  if (qp.get("auth")){
    const r = qp.get("retour") || "", a = qp.get("auth"), hint = qp.get("hint") || "";
    LS.set("retour", /^(complet|envoi)\.html(#[\w-]*)?$/.test(r) ? r : "");
    LS.set("authMail", qp.get("mail") && /^envoi/.test(r) ? 1 : 0); LS.set("authHint", /^[^@\s]+@[^@\s]+$/.test(hint) ? hint : "");
    try { history.replaceState(null, "", location.pathname); } catch(e){}
    if (online() && clientId()){ authRedirect(a === "2" ? true : a === "3" ? "auto" : false); return; }
  }
  const auth = readAuthHash(); LS.set("authMail", 0); LS.set("authHint", "");
  if (auth && LS.get("retour", "")){ const r = LS.get("retour", "");
    /* page d'envoi : on y retourne même si Google a refusé, pour qu'elle l'explique */
    if (auth.ok || /^envoi/.test(r)){ LS.set("retour", ""); location.replace(r + (auth.ok ? "" : "#erreur=" + encodeURIComponent(auth.err || "erreur"))); return; } }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e){}
  S.pending = LS.get("pending", []).filter(p => p && p.op && p.op.id).map(p => (p.etat === "envoi" || p.etat === "verifier") ? Object.assign(p, {etat:"attente", tries:Math.max(1, p.tries || 0)}) : p);
  const cached = LS.get("base", null); S.lastSync = LS.get("lastSync", "");
  if (cached){ S.base = normalize(cached); S.conn = "ok"; recompute(); }
  if (auth && auth.err){ S.connErr = "login"; if (!S.d) S.conn = "login"; }
  if (auth && auth.ok) whoAmI();
  const h = location.hash.slice(1); showTab(TABS.includes(h) ? h : "accueil");
  if (h === "ajout-trajet" && S.d) setTimeout(() => fTrajet(), 60);
  syncLabel();
  syncAll(false, "start");
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(e => console.warn("sw", e));
  window.addEventListener("online", () => { render(); syncLabel(); syncSoon(800); });
  window.addEventListener("offline", () => { render(); syncLabel(); });
  setInterval(() => {
    if (document.visibilityState !== "visible" || syncing || !$("sheet").hidden) return;
    const queued = S.pending.some(p => p.etat === "attente"), old = Date.now() - new Date(S.lastSync || 0).getTime() > 90000;
    if (online() && (queued || (old && tokOk()))) syncAll(false, "minuterie");
  }, 30000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !syncing && (S.pending.some(p => p.etat === "attente") || Date.now() - new Date(S.lastSync || 0).getTime() > 30000)) syncAll(false, "retour");
  });
})();

})();
